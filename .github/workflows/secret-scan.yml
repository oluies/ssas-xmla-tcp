name: Secret scan

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly full-history sweep, Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the scan covers every commit
      # Complements the leak gate rather than duplicating it. The gate scans
      # tracked TEXT for host/IP/SID/connection-string shapes and now refuses
      # binaries outright; TruffleHog scans full history for credential patterns,
      # including inside files the gate cannot read.
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
