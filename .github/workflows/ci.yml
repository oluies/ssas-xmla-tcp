name: CI

on:
  push:
    branches: ["main", "001-ssas-xmla-tcp"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@latest check .
      - run: uvx ruff@latest format --check .

  test-offline:
    name: offline suite (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Constitution III is NON-NEGOTIABLE: the suite runs with sockets disabled
      # and must pass on a machine that has never contacted an Analysis Services
      # instance. No service containers here, deliberately.
      - name: pytest (sockets disabled)
        run: >
          uv run --no-project --python ${{ matrix.python-version }}
          --with pytest --with pytest-socket --with pyspnego
          --with-editable .
          pytest

  dependency-surface:
    name: runtime deps are pyspnego + stdlib only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # A protocol library that drags in a platform SDK is not reusable by the
      # audience it exists for. This job fails if anything else creeps in.
      - name: import with nothing but pyspnego installed
        run: >
          uv run --no-project --python 3.12 --with pyspnego --with-editable .
          python -c "import ssas_xmla; print('public surface:', len(ssas_xmla.__all__), 'names')"

  leak-gate:
    name: no identifying tokens in committed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The same gate the pre-commit hook runs, applied to every tracked file so a
      # bypassed hook or a rebase cannot let a host, IP, SID or token through.
      - name: leak gate over all tracked files
        run: |
          sed 's#git diff --cached --name-only --diff-filter=ACM#git ls-files#' \
            .githooks/pre-commit > /tmp/gate.sh
          chmod +x /tmp/gate.sh
          /tmp/gate.sh
