name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.6.9 check .
      - run: uvx ruff@0.6.9 format --check .

  test-offline:
    name: offline suite (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Constitution III is NON-NEGOTIABLE: the suite runs with sockets disabled
      # and must pass on a machine that has never contacted an Analysis Services
      # instance. No service containers here, deliberately.
      - name: pytest (sockets disabled)
        run: >
          uv run --no-project --python ${{ matrix.python-version }}
          --with-editable ".[dev]"
          pytest

  dependency-surface:
    name: runtime deps are pyspnego + stdlib only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Asserts the DECLARED dependency set, not just that an install succeeds.
      # The previous version ran `uv run --with pyspnego --with-editable .`, which
      # resolves whatever [project.dependencies] declares -- so adding a platform
      # SDK would have installed it and the job would still have gone green.
      - name: assert [project.dependencies] is exactly pyspnego
        run: |
          python3 - <<'EOF'
          import tomllib
          deps = tomllib.load(open("pyproject.toml","rb"))["project"]["dependencies"]
          names = sorted(d.split(">=")[0].split("==")[0].split("[")[0].strip() for d in deps)
          print("declared runtime dependencies:", names)
          assert names == ["pyspnego"], f"unexpected runtime dependency: {names}"
          EOF
      - name: import with nothing but pyspnego installed
        run: >
          uv run --no-project --python 3.12 --with pyspnego --with-editable .
          python -c "import ssas_xmla; print('public surface:', len(ssas_xmla.__all__), 'names')"

  leak-gate:
    name: no identifying tokens in committed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The same gate the pre-commit hook runs, applied to every tracked file so a
      # bypassed hook or a rebase cannot let a host, IP, SID or token through.
      # Runs the hook itself, not a sed-rewritten copy: a rewrite that stops
      # matching yields a gate that scans nothing and exits 0.
      - name: leak gate over all tracked files
        env:
          LEAK_GATE_FILES_CMD: git ls-files
        run: .githooks/pre-commit
      # The gate's boundary is pinned in the tree, both directions: an image tag
      # must pass, a file path carrying a real address must not.
      - name: leak gate boundary cases
        run: ./tests/hooks/test_leak_gate.sh
